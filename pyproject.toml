[project]
name = "dubbingqwen"
version = "0.1.0"
description = "Local Hebrew→English video dubbing pipeline for Apple Silicon"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Transcribe (ivrit-ai Whisper via Apple MLX)
    "mlx-whisper>=0.4.0",
    "mlx>=0.20.0",
    # Translate (TranslateGemma)
    "torch>=2.4.0",
    "transformers>=4.50.0",
    "accelerate>=1.0.0",
    "sentencepiece>=0.2.0",
    # Extract / Phase 1–2 (Demucs + Pyannote)
    "demucs>=4.0.1",
    "pyannote.audio>=3.1.0",
    "ffmpeg-python>=0.2.0",
    "python-dotenv>=1.0.0",
    # Shared tooling
    "huggingface-hub>=0.26.0",
    "hf>=0.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
]

[project.scripts]
dq-transcribe = "inference.transcribe:main"
dq-translate = "inference.translate:main"
dq-extract = "inference.extract_pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inference"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
