[project]
name = "dubbingqwen"
version = "0.1.0"
description = "Local Hebrew→English video dubbing pipeline for Apple Silicon"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Transcribe (ivrit-ai Whisper CT2 via faster-whisper)
    "faster-whisper>=1.1.0",
    # Optional MLX helpers (not used for default ASR)
    "mlx-whisper>=0.4.0",
    "mlx>=0.20.0",
    # Translate (TranslateGemma)
    "torch>=2.4.0",
    "transformers>=4.50.0",
    "accelerate>=1.0.0",
    "sentencepiece>=0.2.0",
    # Extract / Phase 1–2 (Demucs + Pyannote)
    "demucs>=4.0.1",
    "pyannote.audio>=3.1.0",
    "ffmpeg-python>=0.2.0",
    "python-dotenv>=1.0.0",
    "yt-dlp>=2025.1.0",
    # Shared tooling
    "huggingface-hub>=0.26.0",
    "hf>=0.0.1",
    "f5-tts>=1.1.0",
    "qwen-tts",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
]

[project.scripts]
dq-transcribe = "inference.transcribe:main"
dq-translate = "inference.translate:main"
dq-extract = "inference.extract_pipeline:main"
dq-tts = "inference.tts_qwen:main"
dq-tts-f5 = "inference.tts_f5:main"
dq-preview = "inference.build_preview:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inference"]

[tool.uv]
package = true

[tool.uv.sources]
qwen-tts = { path = "third_party/Qwen3-TTS", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
