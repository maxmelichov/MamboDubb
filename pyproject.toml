[project]
name = "dubbingqwen"
version = "0.5.1"
description = "Local Hebrew→English video dubbing pipeline for Apple Silicon"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # ASR: transcript fallback (ivrit-ai Whisper CT2) + English clone verification
    "faster-whisper>=1.1.0",
    # Translation: TranslateGemma-4B (needs bfloat16 on MPS)
    #
    # One requirement written as two, and the split is load bearing rather than
    # cosmetic. Windows is the only platform where this project has two torches
    # to choose between (see the `cuda` and `cpu` extras below), and uv decides
    # where a *direct* dependency of this project comes from once per fork of
    # the resolution, using the markers on the requirement itself. Written as a
    # single unmarkered `torch>=2.4.0`, the lock came back saying "in the cuda
    # fork, torch is the cu126 build" with no platform qualifier at all, so
    # `uv sync --extra cuda` on a Mac tried to install a wheel that exists only
    # for manylinux and win_amd64. Two complementary markers give uv two edges
    # to answer separately, and the answer for everything that is not Windows
    # stops depending on a question only Windows asks.
    "torch>=2.4.0 ; sys_platform != 'win32'",
    "torch>=2.4.0 ; sys_platform == 'win32'",
    "transformers>=4.50.0",
    "accelerate>=1.0.0",
    "sentencepiece>=0.2.0",
    # Stems + diarization
    "demucs>=4.0.1",
    "pyannote.audio>=3.1.0",
    # Input + audio handling
    "yt-dlp>=2025.1.0",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "python-dotenv>=1.0.0",
    # Speech synthesis
    "qwen-tts",
    "huggingface-hub>=0.26.0",
    "hf>=0.0.1",
    # Hebrew as a dub target (dubbing/hebrew.py). `peft` attaches the Hebrew LoRA to
    # the Qwen3-TTS talker and just as importantly switches it off again for the
    # base checkpoint's own ten languages; the adapter is never merged. It asks for
    # `transformers` unpinned, so the 4.57.3 override still holds.
    "peft>=0.19.1",
    # ReNikud Plus: Hebrew orthography → stressed IPA, which is the only text the
    # adapter was trained on. Python 3.12+ only (the project range starts at 3.11),
    # so it is markered rather than dropping 3.11 for everything else without it
    # `dubbing.hebrew.missing()` says so and every other target is unaffected.
    "renikud-plus>=0.3.0 ; python_version >= '3.12'",
    # Gemma 4 (model_type gemma4_unified) is only supported after the June 2026 fix,
    # which is past the last mlx-lm release hence the git pin in [tool.uv.sources].
    # macOS only: mlx has no Linux wheels; on Linux translation runs in the isolated
    # translator venv (see translator/) with transformers 5.x on CUDA.
    "mlx-lm ; sys_platform == 'darwin'",
    "silero-vad>=6.2.1",
    "speechbrain>=1.1.0",
    # Deterministic digit→word spelling for TTS (dubbing/numwords.py)
    "num2words>=0.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0",
]
# The studio server (dubbing_app/) and the lightweight editor (editor/). Kept out
# of the default set so the headless pipeline's dependency closure is unchanged:
# `uv run python -m dubbing` needs none of this, and the app tests skip when absent.
app = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]
# GPU support on Windows. Everything a machine with an NVIDIA card needs and a
# default `uv sync` does not give it.
#
# Two separate failures, one extra, because a user hits both in the same run.
#
# 1. **torch.** PyPI publishes a CUDA `torch` wheel for Linux and a CPU-only one
#    for Windows. So a Windows user with a perfectly good card gets a pipeline
#    where Demucs, pyannote, the speaker embeddings and TTS all run on the CPU,
#    silently, because nothing about that is an error. A real one spent sixteen
#    hours on the stem separation of a single video. The `[[tool.uv.index]]`
#    below is where the CUDA build lives; PyPI does not carry it.
# 2. **CTranslate2.** faster-whisper runs on CTranslate2, whose Windows wheel
#    bundles neither cuBLAS nor cuDNN: it dlopens `cublas64_12.dll` by name at
#    the first forward pass and reports "not found or cannot be loaded" when
#    nothing in the process has made that name resolvable. On Linux the question
#    never comes up, because the CUDA `torch` there drags the whole nvidia stack
#    in as a dependency. The two wheels below put that stack back. They unpack
#    to `site-packages\nvidia\{cublas,cudnn}\bin`, which `dubbing.nvlibs`
#    hands to `os.add_dll_directory`.
#
# `cu12` and `cu126`, not `cu13`: the DLL CTranslate2 4.x asks for is versioned
# into its name, and the name it asks for is cublas64_**12**.dll. A cu13 wheel
# installs cublas64_13.dll, which is a different file answering a different
# question, and a cu130 torch would bundle that one. Picking the CUDA 12 line
# for both is what makes one install serve the ASR and everything else at once.
#
# An extra rather than plain dependencies because this is well over three
# gigabytes and a Windows machine with no NVIDIA card has no use for any of it.
# `install-server.ps1` asks for the extra when `nvidia-smi` says there is a
# card. Every line is markered as well as extra'd, so `--extra cuda` on a Mac or
# a Linux box resolves to nothing at all rather than to a download: uv's own
# `uv sync --extra cuda` on macOS audits and installs zero packages.
#
# It has to be declared here rather than run as a `uv pip install` afterwards.
# `uv run` re-syncs the environment to the lockfile before it runs anything, and
# a pip-installed torch whose version string is `2.13.0+cu126` does not match
# the locked `2.13.0`, so the very next `uv run mambodubb` would quietly put the
# CPU wheel back. The advice this repo used to print had exactly that hole.
cuda = [
    "torch>=2.4.0 ; sys_platform == 'win32'",
    "torchaudio ; sys_platform == 'win32'",
    "nvidia-cublas-cu12>=12.4 ; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9 ; sys_platform == 'win32'",
]
# The other half of the pair, and it exists so that `cuda` can be an *option*
# rather than a fact. An extra alone does not gate an index: torch is a plain
# dependency, so uv resolves it once per platform and, with only one index
# directive in sight, wrote the cu126 build into the lock for every Windows
# resolution whether or not anybody asked for `--extra cuda`. A Windows laptop
# with no NVIDIA card was then told by `install-server.ps1` that it was getting
# CPU wheels and handed three gigabytes of CUDA torch it could never load, and
# `nvlibs.torch_cuda_build()` answered "12.6" on every Windows machine, which is
# the one platform `gpu_check()` and `warn_if_gpu_unused()` were written for: a
# CPU-only build was undetectable because there was no longer such a thing.
#
# What makes the extra real is `[tool.uv] conflicts` below. A declared conflict
# is what makes uv fork the resolution, and a fork is what lets the same package
# have two answers in one lockfile. `cpu` names the fork that takes PyPI's
# `torch-*-win_amd64.whl` (about 122 MB, no CUDA), `cuda` names the fork that
# takes download.pytorch.org's cu126 build, and a resolution that asks for
# neither gets `cpu`'s wheel because that is what PyPI serves with no index
# directive pointing anywhere else. The other half of the fix is the marker
# split on the base `torch` requirement at the top of this file; neither half
# works alone, and the comment there says why.
#
# Markered to win32 like `cuda` is, so this is not a way to ask for a different
# torch on a Mac or on Linux: on those two the extra resolves to nothing and the
# platform's own default wheel is the only one there has ever been. Nobody has
# to type it, either: it is the name of the default rather than a flag, and
# `install-server.ps1` passes `--extra cuda` or it passes neither.
cpu = [
    "torch>=2.4.0 ; sys_platform == 'win32'",
    "torchaudio ; sys_platform == 'win32'",
]

[project.scripts]
dub = "dubbing.cli:main"
mambodubb = "dubbing_app.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dubbing", "dubbing_app", "editor"]

[tool.uv]
package = true
# mlx-lm asks for transformers>=5; qwen-tts pins ==4.57.3, and the two cannot both be
# satisfied. 4.57.3 is the one that has to win (Qwen3-TTS breaks on 5.x), and mlx-lm
# runs fine on it for this workload it only needs transformers for the tokenizer.
# The one incompatibility Gemma 4 does hit there is handled in translate.load().
override-dependencies = [
    "transformers==4.57.3",
    # torch cu130 pins cudnn 9.20, whose wheel is missing libcudnn_engines_tensor_ir;
    # the loader then fills that one sub-library from any system cuDNN and every CUDA
    # conv dies with CUDNN_STATUS_SUBLIBRARY_VERSION_MISMATCH. 9.24+ ships the complete
    # set. An override (not a dependency) so the resolver cannot "fix" it by downgrading
    # torch instead.
    "nvidia-cudnn-cu13>=9.24 ; sys_platform == 'linux'",
]

# The two Windows torch flavours, declared as mutually exclusive so that uv
# forks the resolution instead of picking a winner. This is the block whose
# absence made `--extra cuda` decorative: see the `cpu` extra above for the
# whole story. Nothing else in this project conflicts with anything.
conflicts = [
    [{ extra = "cpu" }, { extra = "cuda" }],
]

# Where the CUDA torch wheels live. `explicit = true` means nothing resolves
# from here unless a source below names it, so PyPI stays the index for the
# other two hundred packages and for torch itself everywhere but the Windows
# `cuda` extra.
#
# cu126 rather than the cu124 this repo used to print: download.pytorch.org has
# no cu124 build of the torch this project locks, so the old advice installed
# nothing or installed something years old. cu126 also happens to be the line
# that bundles cublas64_12.dll, which is the file CTranslate2 goes looking for.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
# Gated on both the extra and the platform, so uv locks two torches: the PyPI
# one for everybody, and the cu126 one for Windows-with-`--extra cuda`.
#
# The `extra =` key is only half of that gate, and the half that does nothing on
# its own. It says *which* fork of the resolution takes this index; it does not
# create the fork. Without the `conflicts` block above there is one Windows
# resolution, this directive is the only thing in it with an opinion about where
# torch comes from, and every Windows install got cu126 including the ones that
# asked for `--extra app` and nothing else.
#
# The `marker` is the other thing that only works in company. On its own it was
# ignored where it mattered most: the lock came back with `torch==2.13.0+cu126`
# under `extra == 'cuda'` and *no* `sys_platform` guard, because the root's own
# unmarkered `torch>=2.4.0` gave uv one edge to answer and one answer to give.
# Splitting that requirement in two (see `[project] dependencies`) is what lets
# this marker be honoured. With both in place the Mac and Linux entries in the
# lock are exactly what they were, package for package and wheel for wheel,
# which is the test this pair has to pass: nobody outside Windows should be able
# to tell that any of it is here.
torch = [{ index = "pytorch-cu126", extra = "cuda", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu126", extra = "cuda", marker = "sys_platform == 'win32'" }]
qwen-tts = { path = "third_party/Qwen3-TTS", editable = true }
mlx-lm = { git = "https://github.com/ml-explore/mlx-lm", rev = "cf10f962b7a20e63a6df43dbf0faf06070153d40" }

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]
