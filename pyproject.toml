[project]
name = "dubbingqwen"
version = "0.1.0"
description = "Local Hebrew→English video dubbing pipeline for Apple Silicon"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # ASR: transcript fallback (ivrit-ai Whisper CT2) + English clone verification
    "faster-whisper>=1.1.0",
    # Translation: TranslateGemma-4B (needs bfloat16 on MPS)
    "torch>=2.4.0",
    "transformers>=4.50.0",
    "accelerate>=1.0.0",
    "sentencepiece>=0.2.0",
    # Stems + diarization
    "demucs>=4.0.1",
    "pyannote.audio>=3.1.0",
    # Input + audio handling
    "yt-dlp>=2025.1.0",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "python-dotenv>=1.0.0",
    # Speech synthesis
    "qwen-tts",
    "huggingface-hub>=0.26.0",
    "hf>=0.0.1",
    "mlx-lm>=0.29.1",
    "silero-vad>=6.2.1",
    "speechbrain>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0",
]

[project.scripts]
dub = "dubbing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dubbing"]

[tool.uv]
package = true

[tool.uv.sources]
qwen-tts = { path = "third_party/Qwen3-TTS", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
