##
# Isolated CUDA translation worker NOT a member of the root uv project.
#
# The main venv pins transformers==4.57.3 (qwen-tts breaks on 5.x), which predates
# Gemma 4's `gemma4_unified` architecture. This subproject gets its own venv with
# transformers >= 5; dubbing/translate.py talks to translator/worker.py over a
# JSON-lines subprocess pipe (`uv run --project translator ...`).
##
[project]
name = "translator"
version = "0.1.0"
description = "Gemma 4 CUDA translation worker (isolated venv, transformers >= 5)"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "transformers>=5",
    "accelerate>=1.0",
    "sentencepiece>=0.2",
]

# vLLM is an optional throughput backend for this same venv (Linux + CUDA only;
# there are no Windows wheels, which is why the transformers worker above stays
# the fallback and is never removed). It fits the base pins rather than fighting
# them vllm 0.27 wants transformers >= 5.5.3 and its own torch, both inside the
# ranges the plain worker already accepts so one venv serves both workers.
#
#   uv sync --project translator --extra vllm
#
# `uv run` re-syncs the venv to whatever extras its command line names, so
# dropping `--extra vllm` from a launch line would *uninstall* vllm. That is why
# `dubbing/translate._worker_cmd` adds the flag whenever the extra is present,
# for either worker, instead of only for the vLLM one.
#
# Low-VRAM mode: 4-bit NF4 weights through bitsandbytes, so the 12B translator
# fits on an ordinary card instead of needing 24 GB. Same venv, same rule about
# `uv run` re-syncing to the extras on its command line (see the vllm note
# above) — `dubbing/translate._lowvram_extra` decides when the flag is passed.
#
#   uv sync --project translator --extra lowvram
#
# Kept an extra rather than a base dependency because bitsandbytes publishes
# CUDA wheels for Linux and Windows only: on a Mac the MLX path never spawns
# this worker, and on a CPU-only box there is nothing for it to quantise onto.
# transformers reads the config through its own integration, so nothing here
# fights the `transformers >= 5` pin above.
[project.optional-dependencies]
vllm = [
    "vllm>=0.27",
]
lowvram = [
    "bitsandbytes>=0.45",
]
# Windows: the CUDA build of torch, unconditionally. PyPI's `torch` is CPU-only
# on Windows, and this venv has its own torch, so nothing the root project does
# reaches the 12B model that runs here: it would decode on the CPU while every
# other stage used the card. The source below sends Windows to the PyTorch
# CUDA 12 index for torch and leaves Linux (where PyPI's torch is already a
# CUDA build) and macOS (where this worker never runs) on PyPI.
#
# A platform marker and not an extra, on purpose. Gating the index on an extra
# was tried first and uv unified every non-Mac platform onto the CUDA 12 wheel,
# Linux included, which would have moved the Linux translator off the CUDA 13
# stack the root project pins for a cuDNN bug. A plain marker forks exactly
# where it says. The cost is a bigger download on a Windows machine with no
# NVIDIA card, and that build still runs on the CPU there, so nothing is lost
# but bandwidth. It also means no launch line has to remember a flag: a bare
# `uv run --project translator` on Windows gets the CUDA torch.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
