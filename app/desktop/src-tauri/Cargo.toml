[package]
name = "dubbing-studio"
version = "0.4.0"
description = "MamboDubb desktop shell"
authors = ["Maxim Melichov"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dubbing_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is the switch for element fullscreen, and the only reason it
# is here. It forwards to `wry/fullscreen`, which sets the `fullScreenEnabled`
# preference on the WKWebView before it is built; without it WebKit rejects every
# `requestFullscreen()` the page makes, which is what "full screen dont work" was.
# It is a private Apple key, so this bundle must never go to the Mac App Store;
# it does not (see `bundle.targets`: app, dmg, nsis, msi, deb, appimage).
#
# It is paired with `app.macOSPrivateApi: true` in tauri.conf.json, and the build
# script fails if the two disagree, so change them together. That flag is not the
# same thing as the window's `fullscreen`, which is only what size the window
# opens at and has never had anything to do with what the page is allowed to do.
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the lockfile as a transitive dependency of tauri, so naming it here
# costs nothing to build; provision.rs uses it to fingerprint the payload tree.
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
