<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MamboDubb</title>

    <!--
      The theme has to be decided before the first frame, not after the bundle
      parses, or every launch flashes the other theme for a beat. These two
      blocks are that: the style paints the canvas for whichever class the
      script stamps, and the script stamps it synchronously in <head>, before
      <body> exists.

      The rules here are a copy of the `html` rules in App.css, and the key and
      class name are a copy of `lib/theme.ts` an inline boot script cannot
      import. If you change one, change the other.

      `theme-color` is what the desktop shell's title bar and the browser's own
      chrome sample. It carries the light plane as its static value because light
      is the default; the script and `applyTheme` move it when the user picks
      dark. There is deliberately no media-query variant of it the OS does
      not get a vote here either.
    -->
    <meta name="theme-color" content="#f2f1ec" />
    <style>
      html {
        background: #f2f1ec;
        color-scheme: light;
      }
      html.theme-dark {
        background: #0d1413;
        color-scheme: dark;
      }
    </style>
    <script>
      (function () {
        // Light unless the user has explicitly stored "dark". The OS
        // preference is never consulted see lib/theme.ts for why.
        var dark = false;
        try {
          dark = localStorage.getItem("dubbing-studio.theme") === "dark";
        } catch (err) {
          // Storage can throw outright in a locked-down profile; default wins.
        }
        document.documentElement.classList.toggle("theme-dark", dark);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#0d1413" : "#f2f1ec");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
